services:
  intelligence:
    build:
      context: .
    image: msb-radar-intelligence:${INTELLIGENCE_IMAGE_TAG:-local}
    container_name: msbradar-intelligence
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - /home/ubuntu/msbradar-intelligence/runtime.env
    environment:
      INTELLIGENCE_BIND_HOST: "0.0.0.0"
      INTELLIGENCE_PORT: "8081"
      INTELLIGENCE_RELEASE_SHA: ${INTELLIGENCE_IMAGE_TAG:-local}
      HAYSTACK_TELEMETRY_ENABLED: "false"
    volumes:
      - intelligence_state:/var/lib/radar-intelligence
    tmpfs:
      - /tmp:size=64m,mode=1777
    expose:
      - "8081"
    networks:
      - msbradar
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  intelligence-indexer:
    image: msb-radar-intelligence:${INTELLIGENCE_IMAGE_TAG:-local}
    container_name: msbradar-intelligence-indexer
    restart: unless-stopped
    init: true
    read_only: true
    command: ["python", "-m", "radar_intelligence.indexing"]
    env_file:
      - /home/ubuntu/msbradar-intelligence/runtime.env
    environment:
      INTELLIGENCE_INDEX_DB: "/var/lib/radar-intelligence/index.sqlite3"
      INTELLIGENCE_SYNC_INTERVAL_SECONDS: "30"
      INTELLIGENCE_FEED_PAGE_SIZE: "100"
      INTELLIGENCE_EMBEDDING_BATCH_SIZE: "1"
      INTELLIGENCE_EMBEDDING_MIN_INTERVAL_SECONDS: "5"
      INTELLIGENCE_ALLOW_LEXICAL_FALLBACK: "1"
      HAYSTACK_TELEMETRY_ENABLED: "false"
    volumes:
      - intelligence_state:/var/lib/radar-intelligence
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - msbradar
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      intelligence:
        condition: service_healthy

volumes:
  intelligence_state:

networks:
  msbradar:
    external: true
    name: msbradar_default
