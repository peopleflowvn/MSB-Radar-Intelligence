name: Probe Oracle Intelligence

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, oracle, intelligence]
    steps:
      - name: Verify live services without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          health=$(sudo docker inspect msbradar-intelligence --format '{{.State.Health.Status}}')
          test "${health}" = healthy
          sudo docker exec -i msbradar-intelligence python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          def fetch(url):
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  with exc:
                      return exc.code, json.load(exc)

          health_status, health = fetch("http://127.0.0.1:8081/health")
          ready_status, ready = fetch("http://127.0.0.1:8081/ready")
          assert health_status == 200 and health["status"] == "ok"
          allowed_ready_keys = {"status", "ready", "missing", "radar_configured", "greennode_configured"}
          assert set(ready) == allowed_ready_keys
          print(json.dumps({
              "health": health,
              "ready_http_status": ready_status,
              "ready": ready,
          }, sort_keys=True))
          PY
          sudo docker exec -i msbradar-intelligence python - <<'PY'
          import json
          import os
          names = (
              "MSB_AI_GREENNODE_BASE_URL",
              "MSB_AI_GREENNODE_API_KEY",
              "MSB_AI_GREENNODE_MODEL",
              "MSB_AI_MODEL_EMBEDDING",
              "INTELLIGENCE_SERVICE_TOKEN",
              "INTELLIGENCE_INDEX_SCOPE_TOKEN",
          )
          print(json.dumps({"legacy_or_integration_setting_present": {
              name: bool(os.environ.get(name, "").strip()) for name in names
          }}, sort_keys=True))
          PY
          sudo docker exec -i msbradar-intelligence python - <<'PY'
          import json
          import urllib.request
          request = urllib.request.Request(
              "http://hub:8000/api/v1/health/", headers={"Host": "localhost"}
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              body = json.load(response)
          assert response.status == 200 and body.get("ok") is True
          print(json.dumps({"radar_internal_health": "ok"}))
          PY
          sudo docker exec msbradar-hub python manage.py shell -c '
          import json
          from ai.models import TaskModelRoute
          from talent.models import EmbeddingConfig
          cfg = EmbeddingConfig.objects.filter(pk=1).first()
          route = TaskModelRoute.objects.filter(task="talent_embedding", enabled=True).first()
          print(json.dumps({
              "embedding_config": ({
                  "mode": cfg.mode,
                  "selfhost_model": cfg.selfhost_model,
                  "greennode_model": cfg.greennode_model,
                  "gemini_model": cfg.gemini_model,
                  "dimensions": cfg.dimensions,
              } if cfg else None),
              "embedding_route": ({
                  "provider": route.provider,
                  "model": route.model,
              } if route else None),
          }, sort_keys=True))
          '
      - name: Verify Radar bridge against production data without exposing PII
        shell: bash
        run: |
          set -euo pipefail
          scope=$(sudo docker exec msbradar-hub python manage.py shell -c '
          from django.contrib.auth import get_user_model
          from accounts import roles
          from talent.corpus_qa import can_read_cv
          from talent.intelligence_views import issue_scope_token
          user = next((u for u in get_user_model().objects.filter(is_active=True).iterator()
                       if roles.can_access(u, roles.MODULE_TALENT) and can_read_cv(u)), None)
          assert user is not None, "No active Talent principal available for scope probe"
          print(issue_scope_token(user))
          ' | tail -n 1)
          test -n "$scope"
          sudo docker exec -e PROBE_SCOPE_TOKEN="$scope" -i msbradar-intelligence python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = "http://hub:8000/api/v1/talent/intelligence"
          service = os.environ["RADAR_SERVICE_TOKEN"]
          index_scope = os.environ["RADAR_INDEX_SCOPE_TOKEN"]

          def get(path, headers):
              request = urllib.request.Request(base + path, headers={"Host": "localhost", **headers})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  return exc.code, json.load(exc)

          denied, _ = get("/document-feed/?limit=1", {
              "Authorization": "Bearer wrong", "X-Radar-Scope-Token": index_scope})
          assert denied == 404
          feed_status, feed = get("/document-feed/?limit=1", {
              "Authorization": f"Bearer {service}", "X-Radar-Scope-Token": index_scope})
          assert feed_status == 200 and feed["events"], "Production feed is empty"
          event = feed["events"][0]
          required = {"event_id", "operation", "document_id", "person_id", "version",
                      "content_hash", "source", "document_type", "text", "updated_at"}
          assert required <= set(event) and event["text"] and event["source"]
          status, evidence = get(f"/evidence/documents/{event['document_id']}/", {
              "Authorization": f"Bearer {service}",
              "X-Radar-Scope-Token": os.environ["PROBE_SCOPE_TOKEN"]})
          assert status == 200
          assert evidence["document_id"] == event["document_id"]
          assert evidence["person_id"] == event["person_id"]
          assert evidence["version"] == event["version"]
          assert evidence["content_hash"] == event["content_hash"]

          search_body = json.dumps({
              "query": "kinh nghiem",
              "scope_token": os.environ["PROBE_SCOPE_TOKEN"],
              "principal_id": "production-probe",
              "limit": 1,
          }).encode()
          denied_search = urllib.request.Request(
              "http://127.0.0.1:8081/v1/search", data=search_body, method="POST",
              headers={"Authorization": "Bearer wrong", "Content-Type": "application/json"})
          try:
              urllib.request.urlopen(denied_search, timeout=30)
              raise AssertionError("wrong V2 service token was accepted")
          except urllib.error.HTTPError as exc:
              assert exc.code == 404
          search_request = urllib.request.Request(
              "http://127.0.0.1:8081/v1/search", data=search_body, method="POST",
              headers={"Authorization": f"Bearer {service}", "Content-Type": "application/json"})
          with urllib.request.urlopen(search_request, timeout=60) as response:
              search = json.load(response)
          assert response.status == 200 and isinstance(search.get("hits"), list)

          status_request = urllib.request.Request(
              "http://127.0.0.1:8081/index-status",
              headers={"Authorization": f"Bearer {service}"},
          )
          with urllib.request.urlopen(status_request, timeout=30) as response:
              index_status = json.load(response)
          assert response.status == 200
          assert {"documents", "chunks", "last_successful_sync_at"} <= set(index_status)
          print(json.dumps({
              "feed_http_status": feed_status,
              "feed_event_count": len(feed["events"]),
              "feed_has_more": bool(feed["has_more"]),
              "wrong_token_rejected": denied == 404,
              "evidence_matches_feed": True,
              "search_http_status": response.status,
              "search_hit_count": len(search["hits"]),
              "wrong_search_token_rejected": True,
              "index_status": index_status,
          }, sort_keys=True))
          PY
