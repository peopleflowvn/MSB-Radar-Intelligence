name: Inventory Oracle Runtime

on:
  workflow_dispatch:

jobs:
  inventory:
    runs-on: [self-hosted, oracle, intelligence]
    steps:
      - name: Report non-secret runtime ownership
        shell: bash
        run: |
          set -euo pipefail
          echo directories
          find /home/ubuntu -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort
          echo containers
          sudo docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}' | sort
          echo compose-projects
          sudo docker ps --format '{{.Label "com.docker.compose.project"}}' | sort -u
      - name: Report disk and Docker build-cache headroom
        shell: bash
        # `deploy-oracle.yml` unconditionally wipes ALL builder cache
        # (`docker builder prune --all --force`) before building Intelligence,
        # justified as "small boot disk cannot retain cache from three Product
        # Core images plus a fresh Intelligence image". Before loosening that
        # to a time-scoped prune (keep same-day cache, reclaim only stale
        # layers) we need real numbers — this is read-only, no container is
        # touched.
        run: |
          set -euo pipefail
          echo disk-usage
          df -h /
          echo docker-system-df
          sudo docker system df
          echo docker-system-df-verbose-build-cache
          sudo docker system df -v | sed -n '/Build cache usage/,$p'
      - name: Report platform release/backup/image accumulation
        shell: bash
        # Ground truth before any cleanup: which release is live (the `current`
        # symlink + `current-sha`), how many old releases/backups/images have
        # piled up with no existing retention, and their sizes. Read-only.
        run: |
          set -euo pipefail
          platform=/home/ubuntu/msb-radar-platform
          echo current-release
          sudo readlink -f "${platform}/current" || true
          sudo cat "${platform}/current-sha" || true
          echo releases
          sudo du -sh "${platform}"/releases/*/ 2>/dev/null | sort -k2 || true
          echo backups
          sudo ls -lh "${platform}/backups/" 2>/dev/null || true
          echo archived-old-checkouts
          sudo du -sh /home/ubuntu/msbradar-local-only-before-* 2>/dev/null || true
          echo msb-radar-intelligence-image-tags
          sudo docker image ls msb-radar-intelligence --format '{{.Tag}}\t{{.CreatedAt}}\t{{.Size}}' | sort -k2 -r || true
