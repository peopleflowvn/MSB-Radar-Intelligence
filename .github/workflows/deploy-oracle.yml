name: Deploy MSB Radar Platform to Oracle

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type DEPLOY_PRODUCTION to deploy Product Core and Intelligence"
        required: true
        default: "DEPLOY_PRODUCTION"
      fast_deploy:
        description: "Fast Deploy (Skip full 180+ test suite & audit, build once & deploy in ~1-2 min)"
        type: boolean
        required: false
        default: true

env:
  # Đặt biến repo PUBLIC_HEALTH_URL khi deploy dưới tên miền khác.
  PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL || 'https://dev-radar.tunghr.io.vn/api/v1/health/' }}

concurrency:
  group: deploy-oracle-production
  cancel-in-progress: false

jobs:
  # Chỉ đọc/kiểm tra (test, typecheck, build, audit)
  validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate Intelligence
        run: |
          if [ "${{ inputs.fast_deploy }}" != "true" ]; then
            python -m pip install --upgrade pip
            python -m pip install ".[production]"
            python -W error::ResourceWarning -m unittest discover -s tests -v
          fi
          python -m compileall -q radar_intelligence tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: product_core/web/package-lock.json
      - name: Validate and Build Product Core frontend
        working-directory: product_core/web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          if [ "${{ inputs.fast_deploy }}" != "true" ]; then
            # Development lint tooling is tracked separately; production browser
            # dependencies must never carry known high-severity advisories.
            npm audit --omit=dev --audit-level=high
          fi
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: product_core/web/dist
          retention-days: 1
      - name: Validate Product Core backend configuration
        working-directory: product_core/server
        env:
          SECRET_KEY: ci-only-not-a-production-secret
          DEBUG: "True"
        run: |
          python manage.py check
          if [ "${{ inputs.fast_deploy }}" != "true" ]; then
            python -m pip install -r requirements.txt
            # Chạy theo APP, không liệt kê từng module.
            python manage.py test talent rb ai people intel core social --verbosity 2
          fi

  deploy-production:
    needs: validate
    if: inputs.confirm_production_deploy == 'DEPLOY_PRODUCTION'
    runs-on: self-hosted
    environment: oracle-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: product_core/web/dist
      - name: Prepare platform-owned release and runtime configuration
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          platform=/home/ubuntu/msb-radar-platform
          release="${platform}/releases/${RELEASE_SHA}"
          sudo install -d -o ubuntu -g ubuntu "${platform}/releases" "${platform}/runtime" "${platform}/backups" "${release}"
          if [ ! -f "${platform}/runtime/product.env" ]; then
            # Host mới không có checkout cũ để kế thừa .env: dừng kèm hướng dẫn.
            if [ ! -f /home/ubuntu/msbradar/.env ]; then
              echo "::error::Missing ${platform}/runtime/product.env - create it from product_core/.env.example (chmod 600) and re-run."
              exit 1
            fi
            sudo cp /home/ubuntu/msbradar/.env "${platform}/runtime/product.env"
            sudo chown ubuntu:ubuntu "${platform}/runtime/product.env"
            chmod 600 "${platform}/runtime/product.env"
          fi
          tar --exclude=.git --exclude=.venv --exclude=.tmp-msb-radar-bootstrap --exclude=node_modules --exclude='__pycache__' -cf - . | tar -xf - -C "${release}"
          ln -sfn "${platform}/runtime/product.env" "${release}/product_core/.env"

          # Host mới chưa có Hub đang chạy: để trống, provision giữ giá trị đã có
          # trong intelligence.env và indexer dùng lexical fallback.
          embedding_model=
          if [ "$(sudo docker inspect msbradar-hub --format '{{.State.Running}}' 2>/dev/null || true)" = true ]; then
            embedding_model=$(sudo docker exec msbradar-hub python manage.py shell -c \
              'from talent.models import EmbeddingConfig; c=EmbeddingConfig.load(); print(c.greennode_model if c.mode == c.MODE_GREENNODE else "")' | tail -n 1)
            printf '%s' "${embedding_model}" | grep -Eq '^[A-Za-z0-9._/-]+$'
          fi
          python3 "${release}/scripts/provision_runtime_env.py" \
            --source "${platform}/runtime/product.env" \
            --target "${platform}/runtime/intelligence.env" \
            --embedding-model "${embedding_model}" \
            --sync-radar-env "${platform}/runtime/product.env"
          chmod 600 "${platform}/runtime/intelligence.env"
          sudo install -d -o ubuntu -g ubuntu /home/ubuntu/msbradar-intelligence
          ln -sfn "${platform}/runtime/intelligence.env" /home/ubuntu/msbradar-intelligence/runtime.env

          python3 - "${platform}/runtime/product.env" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          updates = {"INTELLIGENCE_BASE_URL": "http://intelligence:8081", "INTELLIGENCE_V2_PRIMARY": "1"}
          lines = path.read_text(encoding="utf-8").splitlines()
          seen, output = set(), []
          for line in lines:
              key = line.split("=", 1)[0].strip() if "=" in line and not line.lstrip().startswith("#") else ""
              if key in updates:
                  output.append(f"{key}={updates[key]}")
                  seen.add(key)
              else:
                  output.append(line)
          output.extend(f"{key}={value}" for key, value in updates.items() if key not in seen)
          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY
      - name: Back up the existing production database
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$(sudo docker inspect msbradar-db --format '{{.State.Running}}' 2>/dev/null || true)" != true ]; then
            echo "No running msbradar-db (first deploy on this host) - nothing to back up"
            exit 0
          fi
          sudo docker exec msbradar-db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \
            | gzip > "/home/ubuntu/msb-radar-platform/backups/pre-${RELEASE_SHA}.dump.gz"
          test -s "/home/ubuntu/msb-radar-platform/backups/pre-${RELEASE_SHA}.dump.gz"
      - name: Deploy both services from this repository
        id: deploy_services
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release="/home/ubuntu/msb-radar-platform/releases/${RELEASE_SHA}"
          previous=$(sudo cat /home/ubuntu/msb-radar-platform/current-sha 2>/dev/null || true)
          # Captured BEFORE `current`/`current-sha` move below, for the rollback
          # step further down — it only fires when THIS step (id: deploy_services)
          # fully succeeds but the health verification after it fails.
          echo "PREVIOUS_SHA=${previous}" >> "$GITHUB_ENV"
          build_product_core=1
          reuse_intelligence_parent=
          while read -r ancestor; do
            if git diff --quiet "${ancestor}" "${RELEASE_SHA}" -- Dockerfile pyproject.toml README.md radar_intelligence \
              && sudo docker image inspect "msb-radar-intelligence:${ancestor}" >/dev/null 2>&1; then
              reuse_intelligence_parent="${ancestor}"
              break
            fi
          done < <(git rev-list "${RELEASE_SHA}^")
          if [ -n "${previous}" ] \
            && git cat-file -e "${previous}^{commit}" 2>/dev/null \
            && git diff --quiet "${previous}" "${RELEASE_SHA}" -- product_core; then
            build_product_core=0
            echo "Product Core unchanged since ${previous}; reusing running images"
          fi
          cd "${release}/product_core"
          # Network ngoài mà compose Oracle khai báo; tạo nếu host chưa có.
          sudo docker network inspect talentflow-core_default >/dev/null 2>&1 \
            || sudo docker network create talentflow-core_default
          if [ "$(sudo docker inspect msbradar-hub --format '{{.State.Running}}' 2>/dev/null || true)" != true ]; then
            build_product_core=1
          fi
          if [ "${build_product_core}" = 1 ]; then
            sudo docker compose -p msbradar -f docker-compose.oracle-core.yml build hub extraction-worker embedding-worker alias-resolver
          fi
          sudo docker compose -p msbradar -f docker-compose.oracle-core.yml up -d db hub extraction-worker embedding-worker alias-resolver web
          cd "${release}"
          if [ -n "${reuse_intelligence_parent}" ]; then
            sudo docker tag "msb-radar-intelligence:${reuse_intelligence_parent}" "msb-radar-intelligence:${RELEASE_SHA}"
            echo "Tagged unchanged Intelligence image from ${reuse_intelligence_parent}"
          fi
          if ! sudo docker image inspect "msb-radar-intelligence:${RELEASE_SHA}" >/dev/null 2>&1; then
            # The small Oracle boot disk cannot retain classic-builder cache
            # from three Product Core images plus a fresh Intelligence image.
            # Containers/images in use are untouched; only disposable build
            # cache and dangling intermediate images are reclaimed.
            sudo docker builder prune --all --force
            sudo docker image prune --force
            INTELLIGENCE_IMAGE_TAG="${RELEASE_SHA}" sudo -E docker compose -p msbradar-intelligence -f docker-compose.oracle.yml build
          else
            echo "Reusing completed Intelligence image ${RELEASE_SHA}"
          fi
          INTELLIGENCE_IMAGE_TAG="${RELEASE_SHA}" sudo -E docker compose -p msbradar-intelligence -f docker-compose.oracle.yml up -d
          sudo ln -sfn "${release}" /home/ubuntu/msb-radar-platform/current
          printf '%s\n' "${RELEASE_SHA}" | sudo tee /home/ubuntu/msb-radar-platform/current-sha >/dev/null
      - name: Verify exact release and live production
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(sudo cat /home/ubuntu/msb-radar-platform/current-sha)" = "${RELEASE_SHA}"
          for attempt in $(seq 1 30); do
            hub_health=$(sudo docker inspect msbradar-hub --format '{{.State.Health.Status}}' 2>/dev/null || true)
            intelligence_health=$(sudo docker inspect msbradar-intelligence --format '{{.State.Health.Status}}' 2>/dev/null || true)
            echo "attempt=${attempt} hub=${hub_health:-missing} intelligence=${intelligence_health:-missing} sha=${RELEASE_SHA}"
            if [ "${hub_health}" = healthy ] && [ "${intelligence_health}" = healthy ]; then
              sudo docker exec msbradar-hub python -c "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/')); assert data.get('ok') is True; assert data.get('service') == 'msb-radar-hub'"
              sudo docker exec -e EXPECTED_SHA="${RELEASE_SHA}" msbradar-intelligence python -c "import json,os,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8081/health')); assert data['status']=='ok'; assert data['release_sha']==os.environ['EXPECTED_SHA']"
              test "$(sudo docker inspect msbradar-intelligence-indexer --format '{{.State.Running}}')" = true
              sudo docker inspect msbradar-intelligence --format '{{.Config.Image}}' | grep -F "${RELEASE_SHA}"
              curl -fsS "${PUBLIC_HEALTH_URL}" >/dev/null
              exit 0
            fi
            sleep 5
          done
          sudo docker logs msbradar-hub --tail 100 || true
          sudo docker logs msbradar-intelligence --tail 100 || true
          sudo docker logs msbradar-intelligence-indexer --tail 100 || true
          exit 1
      - name: Roll back to the previous release if verification failed
        # Fires ONLY when "Deploy both services" fully succeeded (both stacks
        # replaced, `current`/`current-sha` already moved to the new SHA) but
        # the health check right after it failed — i.e. the deploy "worked"
        # but the new code is broken. Before this step existed, that state was
        # PERMANENT until a human noticed and SSHed in.
        #
        # KNOWN GAP: does not cover "Deploy both services" itself failing
        # midway — e.g. Product Core's `up -d` succeeds but the Intelligence
        # build crashes straight after. `current-sha` is only written at the
        # very end of that step, so in that window Product Core can already be
        # running new (possibly broken) code while `current-sha` still shows
        # the old one and `steps.deploy_services.outcome` reports 'failure'
        # (skipping this step). That partial-deploy state needs a human; it is
        # rarer than "deploy succeeds, health check catches a runtime bug",
        # which is what this covers.
        if: failure() && steps.deploy_services.outcome == 'success'
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          platform=/home/ubuntu/msb-radar-platform
          if [ -z "${PREVIOUS_SHA:-}" ] || [ "${PREVIOUS_SHA}" = "${RELEASE_SHA}" ]; then
            echo "rollback: no earlier release to restore (first deploy, or previous == current) — production stays on the failed release, needs a human"
            exit 1
          fi
          previous_release="${platform}/releases/${PREVIOUS_SHA}"
          if [ ! -d "${previous_release}/product_core" ]; then
            echo "rollback: release directory for ${PREVIOUS_SHA} is gone — cannot auto-restore, needs a human"
            exit 1
          fi
          echo "rollback: verification failed for ${RELEASE_SHA}; restoring ${PREVIOUS_SHA}"

          cd "${previous_release}/product_core"
          # Product Core has no per-SHA image tag (unlike Intelligence below) —
          # the running image was already overwritten by the failed deploy, so
          # restoring means rebuilding from the previous release's own source.
          # Slower than a tagged-image swap, but correct.
          sudo docker compose -p msbradar -f docker-compose.oracle-core.yml build hub extraction-worker embedding-worker alias-resolver
          sudo docker compose -p msbradar -f docker-compose.oracle-core.yml up -d db hub extraction-worker embedding-worker alias-resolver web

          cd "${previous_release}"
          if sudo docker image inspect "msb-radar-intelligence:${PREVIOUS_SHA}" >/dev/null 2>&1; then
            echo "rollback: reusing existing msb-radar-intelligence:${PREVIOUS_SHA}"
          else
            echo "rollback: msb-radar-intelligence:${PREVIOUS_SHA} was already reclaimed — rebuilding from source"
            INTELLIGENCE_IMAGE_TAG="${PREVIOUS_SHA}" sudo -E docker compose -p msbradar-intelligence -f docker-compose.oracle.yml build
          fi
          INTELLIGENCE_IMAGE_TAG="${PREVIOUS_SHA}" sudo -E docker compose -p msbradar-intelligence -f docker-compose.oracle.yml up -d

          sudo ln -sfn "${previous_release}" "${platform}/current"
          printf '%s\n' "${PREVIOUS_SHA}" | sudo tee "${platform}/current-sha" >/dev/null

          for attempt in $(seq 1 30); do
            hub_health=$(sudo docker inspect msbradar-hub --format '{{.State.Health.Status}}' 2>/dev/null || true)
            intelligence_health=$(sudo docker inspect msbradar-intelligence --format '{{.State.Health.Status}}' 2>/dev/null || true)
            echo "rollback-verify attempt=${attempt} hub=${hub_health:-missing} intelligence=${intelligence_health:-missing} restored_sha=${PREVIOUS_SHA}"
            if [ "${hub_health}" = healthy ] && [ "${intelligence_health}" = healthy ] \
              && curl -fsS "${PUBLIC_HEALTH_URL}" >/dev/null 2>&1; then
              echo "rollback: production restored to ${PREVIOUS_SHA}"
              # The job still ends FAILED (the deploy of ${RELEASE_SHA} did not
              # ship) — this only confirms production itself is healthy again.
              exit 1
            fi
            sleep 5
          done
          echo "rollback: FAILED to restore ${PREVIOUS_SHA} — production may be down, needs a human NOW"
          sudo docker logs msbradar-hub --tail 100 || true
          sudo docker logs msbradar-intelligence --tail 100 || true
          exit 1
      - name: Reclaim disk from superseded Intelligence images
        shell: bash
        # `docker image prune` (used above and in "Maintain Oracle Docker
        # Storage") only removes DANGLING (untagged) images. Every Intelligence
        # build is tagged with its own commit SHA and never becomes dangling —
        # these are the actual driver of the disk pressure that forces
        # `docker builder prune --all --force` before every Intelligence build
        # (boot disk measured at 95% full, 2.5GB free — see Inventory Oracle
        # Runtime). Runs AFTER verification so a bad deploy still has its image
        # on disk for `docker logs`/manual inspection.
        #
        # Keeps the running release plus 2 predecessors: the "reuse unchanged
        # ancestor" step above walks `git rev-list` looking for the nearest
        # ancestor whose image still exists locally, so at least one
        # predecessor must survive for that optimisation to ever fire. This
        # never touches the just-verified running image (RELEASE_SHA is
        # explicitly skipped even if it somehow fell outside the kept range).
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          keep=3
          mapfile -t old_tags < <(
            sudo docker image ls msb-radar-intelligence --format '{{.Tag}}\t{{.CreatedAt}}' \
              | grep -v '^local\b' \
              | sort -t "$(printf '\t')" -k2 -r \
              | tail -n "+$((keep + 1))" \
              | cut -f1
          )
          for tag in ${old_tags[@]+"${old_tags[@]}"}; do
            [ -n "${tag}" ] || continue
            if [ "${tag}" = "${RELEASE_SHA}" ]; then
              echo "reclaim-intelligence-images: skip current release ${tag}"
              continue
            fi
            echo "reclaim-intelligence-images: removing msb-radar-intelligence:${tag}"
            sudo docker rmi "msb-radar-intelligence:${tag}" || true
          done
      - name: Retire the old checkout after successful verification
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          old=/home/ubuntu/msbradar
          archived="/home/ubuntu/msbradar-local-only-before-${RELEASE_SHA}"
          if [ -d "${old}" ] && [ ! -L "${old}" ]; then
            sudo mv "${old}" "${archived}"
          fi
          sudo ln -sfn /home/ubuntu/msb-radar-platform/current/product_core "${old}"
          test "$(readlink -f "${old}")" = "/home/ubuntu/msb-radar-platform/releases/${RELEASE_SHA}/product_core"
