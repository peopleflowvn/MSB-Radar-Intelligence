name: Maintain Oracle Docker Storage

on:
  workflow_dispatch:
    inputs:
      confirm_maintenance:
        description: "Type PRUNE_UNUSED_DOCKER_CACHE"
        required: true
  # Weekly instead of per-deploy: this restarts the Docker/containerd daemons
  # (brief interruption, compose `restart: unless-stopped` plus the health-wait
  # loop below bring production back) — not something to run on every deploy,
  # but the disk keeps refilling between manual runs if nobody remembers to
  # dispatch this by hand. 03:00 ICT Monday (UTC+7) — deep off-hours for a
  # Vietnamese-bank-hours internal tool.
  schedule:
    - cron: "0 20 * * 0"

jobs:
  prune-unused-cache:
    if: github.event_name == 'schedule' || inputs.confirm_maintenance == 'PRUNE_UNUSED_DOCKER_CACHE'
    runs-on: [self-hosted, oracle, intelligence]
    steps:
      - name: Reclaim only unused Docker build data
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before maintenance"
          df -h / /var/lib/docker
          sudo docker system df
          sudo docker builder prune --all --force
          sudo docker image prune --force || true
          # Failed image exports can leave stale containerd snapshot metadata.
          # Clear only incomplete content ingests after resolving the exact
          # containerd path. Images, containers and volumes are outside it.
          ingest=/var/lib/containerd/io.containerd.content.v1.content/ingest
          sudo install -d -m 700 "${ingest}"
          test "$(sudo readlink -f "${ingest}")" = "${ingest}"
          sudo systemctl stop docker
          sudo systemctl stop containerd
          sudo find "${ingest}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          # Restarting both daemons repairs mount state; compose restart policies
          # bring the existing production containers back without touching data.
          sudo systemctl restart containerd
          sudo systemctl restart docker
          for attempt in $(seq 1 30); do
            if [ "$(sudo docker inspect msbradar-db --format '{{.State.Running}}' 2>/dev/null || true)" = true ] \
              && [ "$(sudo docker inspect msbradar-hub --format '{{.State.Running}}' 2>/dev/null || true)" = true ]; then
              break
            fi
            sleep 2
          done
          test "$(sudo docker inspect msbradar-db --format '{{.State.Running}}')" = true
          test "$(sudo docker inspect msbradar-hub --format '{{.State.Running}}')" = true
          echo "Disk after maintenance"
          df -h / /var/lib/docker
          sudo docker system df || true

      - name: Reclaim old releases, backups and the archived pre-migration checkout
        shell: bash
        # None of this has an existing retention policy — every deploy adds a
        # release directory and a pre-deploy DB dump that nothing ever removes.
        # Measured via Inventory Oracle Runtime (2026-09-16): 35 release dirs
        # (~530MB total), 35 backup dumps (~750MB total), and one 4.6GB
        # directory archived by deploy-oracle.yml's "Retire the old checkout"
        # step during the one-time migration to this release-based layout —
        # orphaned since (nothing reads it back; grepped the workflows to
        # confirm), and alone bigger than the entire free disk headroom.
        run: |
          set -euo pipefail
          platform=/home/ubuntu/msb-radar-platform
          # String-compare against `current-sha`, not `readlink -f current` —
          # matches exactly how deploy-oracle.yml derives the release path
          # (`release="${platform}/releases/${RELEASE_SHA}"`), so it can't
          # disagree with the deploy job about which release is live.
          current_sha=$(sudo cat "${platform}/current-sha")
          current_release="${platform}/releases/${current_sha}"

          echo "Releases before: $(sudo ls -1 "${platform}/releases" | wc -l)"
          # Newest-first by mtime; keep the live release plus 2 predecessors —
          # cheap (~15MB each) and the only thing that makes a manual emergency
          # rollback (re-point `current`/`current-sha`, no automation for this
          # today) even possible.
          mapfile -t old_releases < <(
            sudo find "${platform}/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -rn | awk '{print $2}' | tail -n +4
          )
          for dir in ${old_releases[@]+"${old_releases[@]}"}; do
            [ -n "${dir}" ] || continue
            if [ "${dir}" = "${current_release}" ]; then
              echo "reclaim-releases: skip live release ${dir}"
              continue
            fi
            sudo rm -rf -- "${dir}"
          done
          echo "Releases after: $(sudo ls -1 "${platform}/releases" | wc -l)"

          echo "Backups before: $(sudo ls -1 "${platform}/backups" | wc -l)"
          # DB dumps are the actual disaster-recovery net, not a deploy
          # convenience — keep a longer tail than releases/images.
          mapfile -t old_backups < <(
            sudo find "${platform}/backups" -mindepth 1 -maxdepth 1 -type f -printf '%T@ %p\n' \
              | sort -rn | awk '{print $2}' | tail -n +11
          )
          for f in ${old_backups[@]+"${old_backups[@]}"}; do
            [ -n "${f}" ] || continue
            sudo rm -f -- "${f}"
          done
          echo "Backups after: $(sudo ls -1 "${platform}/backups" | wc -l)"

          # One-time migration artifact: deploy-oracle.yml only ever creates
          # this the first time /home/ubuntu/msbradar isn't already a symlink,
          # which is true for every deploy from the second one onward. Nothing
          # reads it back.
          sudo rm -rf /home/ubuntu/msbradar-local-only-before-*
          echo "Disk after release/backup/checkout cleanup"
          df -h /
